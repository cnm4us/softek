# Initial HTTP verification site. The HTTPS configuration replaces this after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name demo.bawebtech.com;

    root /var/www/softek/public;
    index index.html;
    access_log /var/log/nginx/softek.access.log;
    error_log /var/log/nginx/softek.error.log;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/softek/letsencrypt;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "softek nginx ok\n";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
