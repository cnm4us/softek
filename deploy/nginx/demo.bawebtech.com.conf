server {
    listen 80;
    listen [::]:80;
    server_name demo.bawebtech.com;
    access_log /var/log/nginx/softek.access.log;
    error_log /var/log/nginx/softek.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/softek/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://demo.bawebtech.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.bawebtech.com;

    ssl_certificate /etc/letsencrypt/live/demo.bawebtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.bawebtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/softek/public;
    index index.html;
    access_log /var/log/nginx/softek.access.log;
    error_log /var/log/nginx/softek.error.log;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/softek/letsencrypt;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "softek nginx ok\n";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
