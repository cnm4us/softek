server {
    listen 80;
    listen [::]:80;
    server_name demo.bawebtech.com;
    access_log /var/log/nginx/softek.access.log;
    error_log /var/log/nginx/softek.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/softek/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://demo.bawebtech.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.bawebtech.com;

    ssl_certificate /etc/letsencrypt/live/demo.bawebtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.bawebtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/softek/current;
    index index.html;
    access_log /var/log/nginx/softek.access.log;
    error_log /var/log/nginx/softek.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;
    client_max_body_size 32k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/softek/letsencrypt;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "softek nginx ok\n";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    location = /api { return 404; }
    location = /api/admin/banners/upload {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/admin/feature-explorer/[a-f0-9-]+/image$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/banners/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ { try_files $uri =404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
