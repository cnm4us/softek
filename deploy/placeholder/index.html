<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Softek banking demo</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18324a; background: #f3f7f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      main { width: 100%; max-width: 560px; padding: clamp(24px, 6vw, 48px); background: white; border: 1px solid #dae4e9; border-radius: 20px; box-shadow: 0 16px 48px #18324a0a; }
      .label { display: inline-block; margin: 0 0 24px; padding: 6px 12px; border-radius: 24px; background: #e4f4ee; color: #17684f; font-size: 14px; font-weight: 600; }
      h1 { margin: 0 0 16px; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; letter-spacing: -0.025em; }
      p { margin: 0 0 16px; line-height: 1.65; color: #536778; }
      footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e7edf0; font-size: 13px; color: #647789; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">Demo site online</span>
      <h1>Softek banking demo</h1>
      <p>The site is ready. Our fictional banking experience is being built.</p>
      <p>Come back soon to explore accounts, optional services, and savings goals.</p>
      <footer>Fictional demonstration only. No real accounts or money.</footer>
    </main>
  </body>
</html>
